<div class="login-bg relative flex min-h-screen items-center justify-center overflow-hidden px-4 py-10 sm:px-6">
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>

  <div class="relative z-10 w-full max-w-md">
    <div class="mb-8 flex justify-center">
      <img src="assets/vendors/logo-nori-text.svg" alt="Nori" class="h-8 w-auto" />
    </div>

    <div class="rounded-3xl bg-white p-8 shadow-e5 sm:p-10">
      <div class="mb-8 text-center">
        <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-teal-500 to-navy-800 p-2.5 shadow-et">
          <img src="assets/vendors/logo-nori.svg" alt="" class="h-full w-full" />
        </div>
        <h1 class="font-heading text-2xl font-semibold tracking-tight text-type-1">Panel de administración</h1>
        <p class="mt-1 text-sm text-type-2">Ingresa tus credenciales para continuar</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" autocomplete="off" novalidate class="flex flex-col gap-4">
        <!-- Usuario -->
        <div class="flex flex-col gap-1.5">
          <label for="email" class="text-xs font-bold uppercase tracking-wide text-type-2">Usuario o correo</label>
          <div
            class="flex items-center rounded-xl border-[1.5px] bg-surface-bg transition-all duration-base"
            [class.border-border-s]="!isFieldInvalid('email')"
            [class.border-hi]="isFieldInvalid('email')"
            [class.bg-hi-light]="isFieldInvalid('email')"
          >
            <span class="flex items-center pl-4 text-type-3">
              <svg class="h-[18px] w-[18px]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input
              id="email"
              type="text"
              formControlName="email"
              placeholder="Usuario"
              autocomplete="username"
              class="w-full bg-transparent px-3 py-2.5 text-sm text-type-1 outline-none placeholder:text-type-3"
            />
          </div>
          <p *ngIf="isFieldInvalid('email')" class="text-xs text-hi">Por favor ingresa un usuario válido</p>
        </div>

        <!-- Contraseña -->
        <div class="flex flex-col gap-1.5">
          <label for="password" class="text-xs font-bold uppercase tracking-wide text-type-2">Contraseña</label>
          <div
            class="flex items-center rounded-xl border-[1.5px] bg-surface-bg transition-all duration-base"
            [class.border-border-s]="!isFieldInvalid('password')"
            [class.border-hi]="isFieldInvalid('password')"
            [class.bg-hi-light]="isFieldInvalid('password')"
          >
            <span class="flex items-center pl-4 text-type-3">
              <svg class="h-[18px] w-[18px]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••••••"
              autocomplete="current-password"
              class="w-full bg-transparent px-3 py-2.5 text-sm text-type-1 outline-none placeholder:text-type-3"
            />
            <button type="button" (click)="togglePasswordVisibility()" class="flex items-center px-4 text-type-3 transition-colors hover:text-teal-600" aria-label="Mostrar u ocultar contraseña">
              <svg *ngIf="!showPassword" class="h-[18px] w-[18px]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" class="h-[18px] w-[18px]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <p *ngIf="isFieldInvalid('password')" class="text-xs text-hi">La contraseña es requerida (mín. 6 caracteres)</p>
        </div>

        <!-- Remember me -->
        <label class="flex cursor-pointer items-center gap-2 text-sm text-type-2">
          <input type="checkbox" formControlName="rememberMe" class="h-4 w-4 rounded border-border-m text-teal-600 focus:ring-teal-500" />
          Mantener sesión iniciada
        </label>

        <!-- Error -->
        <div *ngIf="errorMessage" class="flex items-center gap-2 rounded-lg border border-hi bg-hi-light px-4 py-3 text-sm text-hi-dark">
          <svg class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          [disabled]="loginForm.invalid || isLoading"
          class="mt-2 flex items-center justify-center gap-2 rounded-xl bg-gradient-to-br from-navy-900 to-teal-700 px-6 py-3 text-sm font-bold text-white shadow-et transition-all duration-base hover:-translate-y-0.5 hover:shadow-et2 disabled:cursor-not-allowed disabled:opacity-60 disabled:hover:translate-y-0"
        >
          <svg *ngIf="isLoading" class="h-[18px] w-[18px] animate-spin" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" opacity="0.25"/>
            <path fill="currentColor" opacity="0.75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
          </svg>
          <span>{{ isLoading ? 'Verificando...' : 'Ingresar al sistema' }}</span>
        </button>
      </form>
    </div>

    <p class="mt-6 text-center text-xs text-white/70">&copy; {{ currentYear }} Nori</p>
  </div>
</div>
