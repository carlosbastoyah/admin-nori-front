<div class="flex h-screen overflow-hidden bg-surface-bg">
  <aside
    class="flex shrink-0 flex-col overflow-hidden bg-gradient-to-b from-navy-900 to-teal-700 text-white transition-[width] duration-base ease-eout"
    [style.width]="sidebarOpen ? '260px' : '76px'"
  >
    <!-- Logo -->
    <div class="flex items-center gap-2.5 px-4 py-5" [class.justify-center]="!sidebarOpen">
      <img src="assets/vendors/logo-nori.svg" class="h-8 w-8 shrink-0" alt="Nori" />
      <span *ngIf="sidebarOpen" class="truncate font-heading text-base font-semibold tracking-tight">Nori Admin</span>
    </div>

    <!-- Nav -->
    <nav class="flex-1 overflow-y-auto px-2 py-2">
      <ng-container *ngFor="let item of navItems">
        <a
          *ngIf="item.route; else disabledItem"
          [routerLink]="item.route"
          routerLinkActive="bg-white/15 text-white"
          class="group relative mb-1 flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-white/75 transition-colors hover:bg-white/10 hover:text-white"
          [class.justify-center]="!sidebarOpen"
        >
          <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path [attr.d]="iconPath(item.icon)" />
          </svg>
          <span *ngIf="sidebarOpen" class="truncate">{{ item.label }}</span>
          <span
            *ngIf="!sidebarOpen"
            class="pointer-events-none absolute left-full z-50 ml-3 whitespace-nowrap rounded-md bg-navy-900 px-2.5 py-1.5 text-xs font-semibold text-white opacity-0 shadow-e3 transition-opacity group-hover:opacity-100"
          >{{ item.label }}</span>
        </a>

        <ng-template #disabledItem>
          <div
            class="group relative mb-1 flex cursor-not-allowed items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-white/35"
            [class.justify-center]="!sidebarOpen"
          >
            <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <path [attr.d]="iconPath(item.icon)" />
            </svg>
            <span *ngIf="sidebarOpen" class="flex-1 truncate">{{ item.label }}</span>
            <span
              *ngIf="!sidebarOpen"
              class="pointer-events-none absolute left-full z-50 ml-3 flex items-center gap-1.5 whitespace-nowrap rounded-md bg-navy-900 px-2.5 py-1.5 text-xs font-semibold text-white/70 opacity-0 shadow-e3 transition-opacity group-hover:opacity-100"
            >
              {{ item.label }}
              <span class="rounded-full bg-white/10 px-1.5 py-0.5 text-[9px] font-bold uppercase tracking-wide text-white/50">Pronto</span>
            </span>
            <span *ngIf="sidebarOpen" class="shrink-0 rounded-full bg-white/10 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide text-white/50">Pronto</span>
          </div>
        </ng-template>
      </ng-container>
    </nav>

    <!-- Collapse toggle -->
    <div class="shrink-0 border-t border-white/10 p-3">
      <button
        type="button"
        (click)="toggleSidebar()"
        class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-white/60 transition-colors hover:bg-white/10 hover:text-white"
        [class.justify-center]="!sidebarOpen"
      >
        <svg class="h-5 w-5 shrink-0 transition-transform duration-base" [class.rotate-180]="sidebarOpen" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
        <span *ngIf="sidebarOpen">Contraer menú</span>
      </button>
    </div>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col overflow-hidden">
    <header class="flex h-16 shrink-0 items-center justify-between border-b border-border-s bg-white px-6 shadow-e1">
      <h1 class="truncate font-heading text-lg font-semibold text-type-1">{{ pageTitle }}</h1>

      <div class="flex items-center gap-4">
        <div class="hidden items-center gap-3 sm:flex">
          <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-teal-50 text-sm font-bold text-teal-700">{{ userInitial }}</div>
          <div class="min-w-0">
            <p class="truncate text-sm font-semibold text-type-1">{{ currentUser?.name || 'Usuario' }}</p>
            <p *ngIf="currentUser?.roles?.length" class="truncate text-xs text-type-3">{{ currentUser?.roles?.[0] }}</p>
          </div>
        </div>

        <button
          type="button"
          (click)="logout()"
          title="Cerrar sesión"
          aria-label="Cerrar sesión"
          class="flex h-9 w-9 items-center justify-center rounded-lg text-type-3 transition-colors hover:bg-hi-light hover:text-hi"
        >
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto">
      <router-outlet />
    </main>
  </div>
</div>
